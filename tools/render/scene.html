<script type="module">
/* Realistic flat-lay pictures for the size finder: a garment laid flat on a wooden floor, a real bank card,
   a yellow tape measure (or cards laid end to end) exactly where to measure.  ?g=tee&v=intro|chest-tape|chest-card|length-tape|length-card
   Units are centimetres. The garment lies in the XY plane (y up the page), the camera looks straight down. */
import * as THREE from "three";

    id.data[i] = (-dx / l * 0.5 + 0.5) * 255; id.data[i + 1] = (dy / l * 0.5 + 0.5) * 255; id.data[i + 2] = (1 / l * 0.5 + 0.5) * 255; id.data[i + 3] = 255;

/* ---------- renderer, camera, light ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(26, 1, 10, 1000);
scene.add(new THREE.HemisphereLight(0xfffaf2, 0xb8a58c, 1.15));
const sun = new THREE.DirectionalLight(0xfff4e6, 2.1); sun.position.set(-95, 75, 105); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); sun.shadow.radius = 6; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;

/* ---------- light oak floor ---------- */
(function floor() {
  const W = 2048, c = cv(W, W), g = c.getContext("2d"), plank = 256;
  for (let y = 0; y < W; y += plank) {

    for (let k = 0; k < 140; k++) { /* grain */

      g.beginPath(); g.moveTo(0, yy); for (let x = 0; x <= W; x += 64) g.lineTo(x, yy + Math.sin(x / (90 + rnd() * 60) + k) * 3); g.stroke();

})();

/* ---------- fabric material for a flat shape (UV = cm) ---------- */
function fabric(color, bbox, paint) {
  const PX = 26, W = Math.round((bbox[2] - bbox[0]) * PX), H = Math.round((bbox[3] - bbox[1]) * PX);
  const c = cv(W, H), g = c.getContext("2d");
  g.fillStyle = color; g.fillRect(0, 0, W, H);
  g.globalAlpha = 0.18; g.globalCompositeOperation = "multiply"; g.drawImage(noiseCanvas(W, H, 40, 50), 0, 0); /* soft mottling */
  g.globalAlpha = 0.12; g.drawImage(noiseCanvas(W, H, 600, 90), 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
  const toPx = (x, y) => [(x - bbox[0]) * PX, (bbox[3] - y) * PX];
  if (paint) paint(g, toPx, PX);

  const hc = cv(1024, Math.round(1024 * H / W)), hg = hc.getContext("2d");
  hg.drawImage(noiseCanvas(hc.width, hc.height, 14, 70), 0, 0);

  [map, nrm].forEach((t) => { t.repeat.set(1 / (bbox[2] - bbox[0]), 1 / (bbox[3] - bbox[1])); t.offset.set(-bbox[0] / (bbox[2] - bbox[0]), -bbox[1] / (bbox[3] - bbox[1])); });

}
/* soft cloth: a dense plane cut to the garment's outline, raised like fabric (round edges that fall to the floor,

  hg.globalCompositeOperation = "destination-in"; hg.drawImage(sil, 0, 0); hg.globalCompositeOperation = "source-over";

  g.globalAlpha = 1; g.globalCompositeOperation = "source-over";

      g.save(); g.filter = `blur(${w * PX * 0.45}px)`; g.strokeStyle = `rgba(${rgb},${a})`; g.lineWidth = w * PX * 0.55; g.lineCap = "round";

}
function flatPiece(shape, mat, depth = 0.9) {

/* ---------- T-shirt (chest 54 cm flat, length 74 cm from the high shoulder point) ---------- */
const TEE = { chestY: 50, armpit: 27, hpsX: 9.5, top: 74, hem: 0.6 };
function makeTee(color = "#a7abb0") {
  const s = new THREE.Shape(), R = (pts) => pts, L = (pts) => pts.map(([x, y]) => [-x, y]);
  /* right half, from the back neck centre going clockwise to the hem centre */
  const right = [["M", 0, 72.2], ["Q", 5, 72.4, 9.5, 74], ["L", 23, 70.6], ["Q", 30, 64, 36.4, 57.2], ["L", 30.8, 47.6], ["Q", 28.2, 50.6, 27, 52.4],
                 ["Q", 27.1, 26, 27.3, 1.4], ["Q", 14, 0, 0, 0.3]];
  const draw = (path, mirror) => path.forEach(([k, ...a]) => {
    const p = mirror ? a.map((v, i) => (i % 2 ? v : -v)) : a;
    if (k === "M") s.moveTo(...p); else if (k === "L") s.lineTo(...p); else s.quadraticCurveTo(...p);
  });

  s.quadraticCurveTo(-14, 0, -27.3, 1.4); s.quadraticCurveTo(-27.1, 26, -27, 52.4); s.quadraticCurveTo(-28.2, 50.6, -30.8, 47.6);
  s.lineTo(-36.4, 57.2); s.quadraticCurveTo(-30, 64, -23, 70.6); s.lineTo(-9.5, 74); s.quadraticCurveTo(-5, 72.4, 0, 72.2);
  const bbox = [-40, -3, 40, 77];
  const folds = [[-23, 47, -11, 28, 4, 0.55], [23, 46, 12, 27, 4, 0.5], [-31, 58, -24, 52, 2.5, 0.5], [30, 57, 24, 51, 2.5, 0.5],
                 [5, 60, 10, 38, 3, 0.35], [-8, 25, 3, 17, 5, 0.35], [-20, 66, -14, 60, 3, 0.3]];
  const paintTee = (g, toPx, PX) => {

    g.fillStyle = "rgba(0,0,0,.28)"; g.beginPath(); let p = toPx(-9.5, 74); g.moveTo(...p);
    g.quadraticCurveTo(...toPx(-8.5, 65.5), ...toPx(0, 64.6)); g.quadraticCurveTo(...toPx(8.5, 65.5), ...toPx(9.5, 74));
    g.quadraticCurveTo(...toPx(5, 72.4), ...toPx(0, 72.2)); g.quadraticCurveTo(...toPx(-5, 72.4), ...toPx(-9.5, 74)); g.fill();

    const line = (a, b) => { g.beginPath(); g.moveTo(...toPx(...a)); g.lineTo(...toPx(...b)); g.stroke(); };
    for (const off of [2.2, 2.7]) { g.beginPath(); g.moveTo(...toPx(-27.1, 1.4 + off)); g.quadraticCurveTo(...toPx(0, off - 0.1), ...toPx(27.1, 1.4 + off)); g.stroke(); }
    for (const sgn of [1, -1]) for (const off of [2, 2.5]) line([sgn * (36.4 - off * 0.86), 57.2 - off * 0.5], [sgn * (30.8 - off * 0.86), 47.6 - off * 0.5]);
    g.setLineDash([]); g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 0.08 * PX;
    for (const sgn of [1, -1]) { line([sgn * 9.5, 74], [sgn * 23, 70.6]); g.beginPath(); g.moveTo(...toPx(sgn * 23, 70.6)); g.quadraticCurveTo(...toPx(sgn * 25.5, 61), ...toPx(sgn * 27, 52.4)); g.stroke(); }
  };

  grp.add(tube([[-9.2, 73.3], [-4.8, 72.5], [0, 72.3], [4.8, 72.5], [9.2, 73.3]], 0.42, rib, 2.3)); /* back neck rib */

/* ---------- bank card (85.6 x 53.98 mm), face up so it is recognisable ---------- */

  g.fillStyle = cg; g.beginPath(); g.roundRect(170, 370, 250, 195, 30); g.fill();
  g.strokeStyle = "rgba(90,65,10,.55)"; g.lineWidth = 5; g.beginPath(); g.moveTo(170, 435); g.lineTo(420, 435); g.moveTo(170, 500); g.lineTo(420, 500); g.moveTo(295, 370); g.lineTo(295, 435); g.moveTo(295, 500); g.lineTo(295, 565); g.stroke();

  g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 12; g.lineCap = "round"; for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(470, 467, 30 + i * 26, -0.7, 0.7); g.stroke(); }
  g.fillStyle = "rgba(235,240,255,.92)"; g.font = "600 92px 'OCR A Std', 'Courier New', monospace"; g.fillText("4000  1234  5678  9010", 150, 760);
  g.font = "500 52px Arial"; g.fillStyle = "rgba(235,240,255,.75)"; g.fillText("VALID THRU 12/30", 150, 860); g.fillText("YOUR NAME", 150, 950);
  g.font = "italic 800 120px Arial"; g.fillStyle = "rgba(255,255,255,.95)"; g.fillText("DEBIT", 1290, 180);
  g.beginPath(); g.fillStyle = "#eb001b"; g.globalAlpha = .9; g.arc(1420, 900, 95, 0, 7); g.fill(); g.fillStyle = "#f79e1b"; g.arc(1540, 900, 95, 0, 7); g.fill(); g.globalAlpha = 1;

  const m = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: 0.076, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.01, bevelSegments: 2 }), [mat, edge]);

/* ---------- yellow tape measure from a to b (cm ticks), with the case beyond b ---------- */
function makeTape(a, b, z) {
